<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &#8212; MNB Omni Caller</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0b0c;--panel:#141416;--border:#2a2a2f;--text:#f4f2ee;--muted:#9a958c;--accent:#ff7a18;--accent2:#ffab5e;--grad:linear-gradient(135deg,#ff7a18,#ffb347)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:34px;max-width:420px;width:100%}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:20px;justify-content:center}
.logo .mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--grad);color:#111;font-weight:800}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:22px;margin-bottom:6px;text-align:center}
p.sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--accent)}
button{margin-top:20px;width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--grad);color:#111}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:16px;padding:13px 15px;border-radius:10px;font-size:14.5px;display:none}
.msg.ok{display:block;background:rgba(67,185,127,.14);border:1px solid rgba(67,185,127,.4);color:#8fe4b8}
.msg.err{display:block;background:rgba(224,93,85,.14);border:1px solid rgba(224,93,85,.4);color:#f0a7a2}
a.home{display:block;text-align:center;margin-top:16px;color:var(--accent2);text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="mark">MNB</span><span>MNB Research <span class="grad-text">Omni Caller</span></span></div>
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your account.</p>
  <form id="rform" novalidate>
    <label for="pw">New password</label>
    <input id="pw" type="password" placeholder="At least 6 characters" minlength="6" required>
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" placeholder="Re-enter password" minlength="6" required>
    <button id="btn" type="submit">Reset password</button>
    <div class="msg" id="msg"></div>
  </form>
  <a class="home" href="/app">Back to sign in</a>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search), token=q.get('token')||'';
  var form=document.getElementById('rform'),btn=document.getElementById('btn'),box=document.getElementById('msg');
  function show(cls,t){box.className='msg '+cls;box.textContent=t;}
  if(!token){show('err','This reset link is missing its token. Please use the link from your email or request a new one.');btn.disabled=true;}
  form.addEventListener('submit',async function(e){
    e.preventDefault();box.className='msg';box.textContent='';
    var pw=document.getElementById('pw').value,pw2=document.getElementById('pw2').value;
    if(pw.length<6){show('err','Password must be at least 6 characters.');return;}
    if(pw!==pw2){show('err','The two passwords do not match.');return;}
    btn.disabled=true;var old=btn.textContent;btn.textContent='Resetting...';
    try{
      var r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,newPassword:pw})});
      var j=await r.json().catch(function(){return{};});
      if(r.ok&&j.ok){show('ok',(j.message||'Password reset.')+' Redirecting to sign in...');setTimeout(function(){location.href='/app';},1800);}
      else{show('err',j.error||'Could not reset password. Please request a new link.');btn.disabled=false;btn.textContent=old;}
    }catch(err){show('err','Network error. Please try again.');btn.disabled=false;btn.textContent=old;}
  });
})();
</script>
</body>
</html>
